<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة الأبنية المدرسية الذكية - التحديث البصري</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="منظومة الأبنية">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/167/167707.png">

    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root {
            --bg-dark: #080c14;
            --panel-bg: rgba(13, 19, 33, 0.88);
            --gold: #f59e0b;
            --blue: #38bdf8;
            --red: #ef4444;
            --purple: #a855f7;
            --green: #10b981;
            --pink: #ec4899;
            --orange: #f97316;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }

        #map { width: 100%; height: 100vh; z-index: 1; background: #000; }

        /* الشريط العلوي */
        .header-panel {
            position: absolute; top: 12px; right: 12px; left: 12px; z-index: 1000;
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 18px;
            padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8);
        }
        .brand { font-size: 1.05rem; font-weight: 800; color: var(--gold); display: flex; align-items: center; gap: 10px; }
        
        .search-container {
            display: flex; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; padding: 4px 12px; flex: 1; max-width: 260px;
        }
        .search-container input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 0.85rem; padding: 4px; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 14px; border-radius: 12px; cursor: pointer;
            font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 6px;
            transition: all 0.25 ease; backdrop-filter: blur(8px);
        }
        .btn:active { transform: scale(0.92); }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; }
        .btn-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); color: #fff; border: none; }

        /* شريط الإحصائيات الفوري */
        .stats-bar {
            position: absolute; top: 76px; right: 12px; left: 12px; z-index: 999;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px;
            pointer-events: none;
        }
        .stat-card {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
            padding: 8px 10px; text-align: center; pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .stat-card .num { font-size: 1.15rem; font-weight: 900; color: var(--gold); }
        .stat-card .label { font-size: 0.68rem; color: var(--text-sub); font-weight: 600; }

        /* نافذة الإدخال المقسمة تبويبياً */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            align-items: center; justify-content: center; padding: 12px;
        }
        .modal-content {
            background: #0f172a; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto;
            border-radius: 24px; padding: 22px; border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        /* التبويبات Tabs */
        .tabs { display: flex; gap: 6px; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; overflow-x: auto; }
        .tab-btn {
            background: transparent; border: none; color: var(--text-sub);
            padding: 6px 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
            border-radius: 10px; transition: 0.2s; whitespace: nowrap;
        }
        .tab-btn.active { background: var(--blue); color: #0f172a; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.75rem; margin-bottom: 4px; color: var(--text-sub); font-weight: 700; }
        .form-control {
            width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155;
            background: #1e293b; color: white; font-size: 0.85rem; outline: none;
        }
        .form-control:focus { border-color: var(--blue); }

        /* أدوات الخريطة الميدانية */
        .map-tools {
            position: absolute; bottom: 25px; right: 15px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .tool-btn {
            width: 46px; height: 46px; border-radius: 50%; background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.25); color: white; display: flex;
            align-items: center; justify-content: center; font-size: 1.15rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .tool-btn:active { transform: scale(0.9); }

        /* -------------------------------------------------------------------------- */
        /* 🎨 التأثيرات البصرية وأيقونات الدبابيس المخصصة (Custom Pin Animations) */
        /* -------------------------------------------------------------------------- */

        .custom-pin {
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 2px solid #ffffff; transition: all 0.3s ease;
        }
        .custom-pin i {
            transform: rotate(45deg); font-size: 1rem; color: #ffffff;
        }

        /* ألوان الدبابيس */
        .pin-kindergarten { background: linear-gradient(135deg, #ec4899, #be185d); } /* رياض الأطفال - وردي */
        .pin-primary { background: linear-gradient(135deg, #10b981, #047857); }      /* ابتدائية - أخضر */
        .pin-secondary { background: linear-gradient(135deg, #38bdf8, #0369a1); }    /* إعدادية وثانوية - أزرق */
        .pin-construction { background: linear-gradient(135deg, #f97316, #c2410c); } /* قيد الإنشاء - برتقالي */
        .pin-caravan { background: linear-gradient(135deg, #a855f7, #6b21a8); }      /* كرفاني - بنفسجي */
        
        /* 🌋 حركة اهتزاز الزلزال للدبابيس الخطيرة */
        .pin-danger {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            animation: quakeShake 1.2s infinite ease-in-out, pulseGlow 1.5s infinite;
        }

        @keyframes quakeShake {
            0%, 100% { transform: rotate(-45deg) translate(0, 0); }
            20% { transform: rotate(-45deg) translate(-2px, 2px); }
            40% { transform: rotate(-45deg) translate(2px, -2px); }
            60% { transform: rotate(-45deg) translate(-2px, -1px); }
            80% { transform: rotate(-45deg) translate(2px, 1px); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* تخصيص النوافذ المنبثقة (Popups) */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px !important; color: white !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7) !important;
        }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }

        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .badge-danger { background: var(--red); color: white; }
        .badge-caravan { background: var(--purple); color: white; }
        .badge-warning { background: var(--orange); color: white; }
        .badge-success { background: var(--green); color: white; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header-panel">
        <div class="brand">
            <i class="fa-solid fa-earth-americas" style="color: var(--blue);"></i>
            <span>منظومة الأبنية GIS</span>
        </div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub); font-size: 0.8rem;"></i>
            <input type="text" id="searchInput" oninput="searchSchools()" placeholder="بحث بالمدرسة أو المعرف...">
        </div>

        <div class="btn-group">
            <button class="btn btn-purple" onclick="filterBy('caravan')"><i class="fa-solid fa-campground"></i> الكرفانات</button>
            <button class="btn btn-danger" onclick="filterBy('danger')"><i class="fa-solid fa-volcano"></i> الحالات الخطرة</button>
            <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> تقييم جديد</button>
            <button class="btn btn-success" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> تصدير التقرير</button>
        </div>
    </div>

    <!-- شاشة الإحصائيات الميدانية (Dashboard) -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="num" id="statTotal">0</div>
            <div class="label">إجمالي المدارس</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statStudents">0</div>
            <div class="label">الاستيعاب الطلابي</div>
        </div>
        <div class="stat-card">
            <div class="num" style="color: var(--purple);" id="statCaravans">0</div>
            <div class="label">المباني الكرفانية</div>
        </div>
        <div class="stat-card">
            <div class="num" style="color: var(--red);" id="statDanger">0</div>
            <div class="label">آيلة للتقويض</div>
        </div>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- أدوات التحكم والجغرافيا -->
    <div class="map-tools">
        <div class="tool-btn" onclick="locateUser()" title="موقعي الحقيقي"><i class="fa-solid fa-crosshairs"></i></div>
        <div class="tool-btn" onclick="resetFilter()" title="إعادة تعيين الخريطة"><i class="fa-solid fa-arrow-rotate-right"></i></div>
    </div>

    <!-- النافذة التفاعلية للتقييم والمسح الميداني -->
    <div class="modal" id="schoolModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: var(--gold); font-size: 1.1rem;"><i class="fa-solid fa-clipboard-check"></i> استمارة التقييم والمسح الميداني</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer; font-size: 1.2rem;" onclick="closeModal()"></i>
            </div>

            <!-- أزرار التبويب -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab1', this)">1. المعلومات العامة</button>
                <button class="tab-btn" onclick="switchTab('tab2', this)">2. الهيكل والسلامة</button>
                <button class="tab-btn" onclick="switchTab('tab3', this)">3. السعة والمساحات</button>
                <button class="tab-btn" onclick="switchTab('tab4', this)">4. الصور والملاحظات</button>
            </div>

            <form id="schoolForm">
                <!-- التبويب 1 -->
                <div id="tab1" class="tab-content active">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اسم المدرسة الرسمي *</label>
                            <input type="text" id="schoolName" class="form-control" required placeholder="مثال: مدرسة الأمل">
                        </div>
                        <div class="form-group">
                            <label>الرمز الإحصائي / المعرف</label>
                            <input type="text" id="schoolCode" class="form-control" placeholder="مثال: SCH-9021">
                        </div>
                        <div class="form-group">
                            <label>المرحلة الدراسية *</label>
                            <select id="schoolType" class="form-control">
                                <option value="روضة أطفال">روضة أطفال</option>
                                <option value="ابتدائية">ابتدائية</option>
                                <option value="متوسطة">متوسطة</option>
                                <option value="إعدادية / ثانوية">إعدادية / ثانوية</option>
                                <option value="مشروع قيد الإنشاء">مشروع قيد الإنشاء</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>نظام الدوام</label>
                            <select id="shiftType" class="form-control">
                                <option value="صباحي">صباحي (أحادي)</option>
                                <option value="مزدوج">مزدوج (ثنائي)</option>
                                <option value="ثلاثي">ثلاثي (اكتظاظ مرتفع)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- التبويب 2 -->
                <div id="tab2" class="tab-content">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>نوع الهيكل الإنشائي *</label>
                            <select id="buildingType" class="form-control">
                                <option value="صبة جاهزة / كونكريت">صبة جاهزة / كونكريت</option>
                                <option value="كرفاني / سندويش بنل">كرفاني / سندويش بنل</option>
                                <option value="طين / بناء قديم">طين / بناء قديم</option>
                                <option value="مبنى مؤجر">مبنى مؤجر</option>
                                <option value="مختلط (ثابت + كرفانات)">مختلط (ثابت + كرفانات)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>حالة السلامة الإنشائية</label>
                            <select id="structuralStatus" class="form-control">
                                <option value="ممتازة / جيدة">ممتازة / جيدة</option>
                                <option value="تحتاج صيانة وترميم">تحتاج صيانة وترميم</option>
                                <option value="أضرار هيكلية خطيرة">أضرار هيكلية خطيرة</option>
                                <option value="آيلة للتقويض والهدم">آيلة للتقويض والهدم</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>عدد الكرفانات الملحقة</label>
                            <input type="number" id="caravanCount" class="form-control" value="0">
                        </div>
                        <div class="form-group">
                            <label>نسبة الأضرار الهيكلية (%)</label>
                            <input type="number" id="damageRatio" class="form-control" min="0" max="100" value="0">
                        </div>
                    </div>
                </div>

                <!-- التبويب 3 -->
                <div id="tab3" class="tab-content">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>عدد الطلاب الإجمالي</label>
                            <input type="number" id="studentCount" class="form-control" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>عدد الصفوف / القاعات</label>
                            <input type="number" id="classroomCount" class="form-control" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>المساحة الكلية (م²)</label>
                            <input type="number" id="totalArea" class="form-control" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>مساحة البناء (م²)</label>
                            <input type="number" id="builtArea" class="form-control" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- التبويب 4 -->
                <div id="tab4" class="tab-content">
                    <div class="form-group">
                        <label>صورة المبنى المدرسي</label>
                        <input type="file" id="schoolImage" accept="image/*" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>ملاحظات المهندس الميداني</label>
                        <textarea id="fieldNotes" class="form-control" rows="3" placeholder="أدخل تفاصيل التقييم أو التوصيات الخاصة بإعادة الإعمار..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 15px; padding: 12px; font-size: 0.95rem;">
                    <i class="fa-solid fa-floppy-disk"></i> اعتماد وحفظ التقرير الميداني
                </button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة والتركيز الافتراضي
        const map = L.map('map', { zoomControl: false }).setView([33.3152, 44.3661], 12);

        // 🗺️ خرائط Google Satellite المباشرة عالية الدقة
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        }).addTo(map);

        let schools = JSON.parse(localStorage.getItem('schools_v_pro')) || [];
        let markersGroup = L.layerGroup().addTo(map);
        let tempCoords = null;

        // تبديل التبويبات
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // تحديث الإحصائيات الفورية
        function updateDashboard(data = schools) {
            document.getElementById('statTotal').innerText = data.length;
            const totalStudents = data.reduce((acc, s) => acc + (parseInt(s.students) || 0), 0);
            document.getElementById('statStudents').innerText = totalStudents.toLocaleString('ar-EG');

            const caravans = data.filter(s => s.buildingType.includes('كرفاني') || parseInt(s.caravanCount) > 0);
            document.getElementById('statCaravans').innerText = caravans.length;

            const danger = data.filter(s => s.structuralStatus.includes('آيلة') || s.structuralStatus.includes('أضرار'));
            document.getElementById('statDanger').innerText = danger.length;
        }

        // إنشاء دبابيس هندسية مخصصة بحسب نوع المدرسة
        function createCustomIcon(school) {
            let pinClass = "pin-secondary";
            let iconClass = "fa-graduation-cap";

            // تحديد الشكل والأيقونة
            if (school.type.includes("روضة")) {
                pinClass = "pin-kindergarten";
                iconClass = "fa-child";
            } else if (school.type.includes("ابتدائية")) {
                pinClass = "pin-primary";
                iconClass = "fa-book-open";
            } else if (school.type.includes("إنشاء")) {
                pinClass = "pin-construction";
                iconClass = "fa-helmet-safety";
            }

            // إذا كانت كرفانية
            if (school.buildingType.includes("كرفاني") || school.caravanCount > 0) {
                pinClass = "pin-caravan";
                iconClass = "fa-campground";
            }

            // إذا كانت حالة المبنى خطرة أو آيلة للتقويض (تتزلزل مظهرياً)
            if (school.structuralStatus.includes("آيلة") || school.structuralStatus.includes("أضرار")) {
                pinClass = "pin-danger";
                iconClass = "fa-triangle-exclamation";
            }

            return L.divIcon({
                className: 'custom-pin-wrapper',
                html: `<div class="custom-pin ${pinClass}"><i class="fa-solid ${iconClass}"></i></div>`,
                iconSize: [38, 38],
                iconAnchor: [19, 38],
                popupAnchor: [0, -38]
            });
        }

        // تحميل وعرض المؤشرات على الخريطة
        function loadSchools(dataToLoad = schools) {
            markersGroup.clearLayers();
            dataToLoad.forEach(school => addMarker(school));
            updateDashboard(schools);
        }

        // إضافة دبابيس على الخريطة
        function addMarker(school) {
            const customIcon = createCustomIcon(school);
            const marker = L.marker([school.lat, school.lng], { icon: customIcon });

            let badgeClass = "badge-success";
            if (school.structuralStatus.includes("صيانة")) badgeClass = "badge-warning";
            if (school.buildingType.includes("كرفاني") || school.caravanCount > 0) badgeClass = "badge-caravan";
            if (school.structuralStatus.includes("آيلة") || school.structuralStatus.includes("أضرار")) badgeClass = "badge-danger";

            let popupContent = `
                <div style="direction:rtl; font-size:13px; max-width:260px;">
                    <b style="font-size:15px; color:#f8fafc;">${school.name}</b> 
                    <span class="badge ${badgeClass}">${school.buildingType}</span><br>
                    <hr style="margin:6px 0; border:0; border-top:1px solid rgba(255,255,255,0.15);">
                    <b>الرمز المرجعي:</b> ${school.code || 'غير محدد'}<br>
                    <b>المرحلة والدوام:</b> ${school.type} (${school.shift})<br>
                    <b>حالة المبنى:</b> ${school.structuralStatus}<br>
                    <b>الكرفانات الملحقة:</b> ${school.caravanCount || 0} كرفان<br>
                    <b>الطلاب / الصفوف:</b> ${school.students || 0} طالب / ${school.classrooms || 0} صف<br>
                    <b>نسبة الأضرار:</b> <span style="color:#ef4444; font-weight:bold;">${school.damageRatio || 0}%</span><br>
            `;

            if (school.notes) {
                popupContent += `<div style="background:rgba(255,255,255,0.08); padding:6px; border-radius:6px; margin-top:6px; font-size:11px;"><b>ملاحظات:</b> ${school.notes}</div>`;
            }

            if (school.image) {
                popupContent += `<img src="${school.image}" style="width:100%; max-height:120px; border-radius:8px; margin-top:8px; object-fit:cover;">`;
            }
            
            popupContent += `</div>`;
            marker.bindPopup(popupContent);
            markersGroup.addLayer(marker);
        }

        // النقر على الخريطة لتحديد الموقع
        map.on('click', function(e) {
            tempCoords = e.latlng;
            openModal();
        });

        function openModal() {
            if (!tempCoords) tempCoords = map.getCenter();
            document.getElementById('schoolModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('schoolModal').style.display = 'none';
            tempCoords = null;
        }

        // حفظ البيانات في LocalStorage
        document.getElementById('schoolForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const imageInput = document.getElementById('schoolImage');
            
            const saveProcess = (imageData) => {
                const newSchool = {
                    id: Date.now(),
                    name: document.getElementById('schoolName').value,
                    code: document.getElementById('schoolCode').value,
                    type: document.getElementById('schoolType').value,
                    shift: document.getElementById('shiftType').value,
                    buildingType: document.getElementById('buildingType').value,
                    structuralStatus: document.getElementById('structuralStatus').value,
                    caravanCount: document.getElementById('caravanCount').value,
                    damageRatio: document.getElementById('damageRatio').value,
                    students: document.getElementById('studentCount').value,
                    classrooms: document.getElementById('classroomCount').value,
                    totalArea: document.getElementById('totalArea').value,
                    builtArea: document.getElementById('builtArea').value,
                    notes: document.getElementById('fieldNotes').value,
                    lat: tempCoords.lat,
                    lng: tempCoords.lng,
                    image: imageData
                };

                schools.push(newSchool);
                localStorage.setItem('schools_v_pro', JSON.stringify(schools));
                addMarker(newSchool);
                updateDashboard(schools);
                closeModal();
                document.getElementById('schoolForm').reset();
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveProcess(e.target.result); };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveProcess(null);
            }
        });

        // البحث الفوري
        function searchSchools() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = schools.filter(s => 
                s.name.toLowerCase().includes(val) || (s.code && s.code.toLowerCase().includes(val))
            );
            loadSchools(filtered);
        }

        // الفلترة الذكية
        function filterBy(type) {
            if (type === 'caravan') {
                const caravans = schools.filter(s => s.buildingType.includes('كرفاني') || parseInt(s.caravanCount) > 0);
                loadSchools(caravans);
            } else if (type === 'danger') {
                const danger = schools.filter(s => s.structuralStatus.includes('آيلة') || s.structuralStatus.includes('أضرار'));
                loadSchools(danger);
            }
        }

        function resetFilter() {
            document.getElementById('searchInput').value = '';
            loadSchools(schools);
        }

        // تحديد موقع الجغرافيا الحالي
        function locateUser() {
            map.locate({setView: true, maxZoom: 17});
        }
        map.on('locationfound', function(e) {
            L.circle(e.latlng, e.accuracy, { color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.2 }).addTo(map);
            L.marker(e.latlng).addTo(map).bindPopup("موقع المهندس الميداني الحالي").openPopup();
        });

        // تصدير التقرير
        function exportToCSV() {
            if(schools.length === 0) { alert('لا توجد بيانات مسجلة لتصديرها!'); return; }
            let csv = "data:text/csv;charset=utf-8,\uFEFFاسم المدرسة,الرمز المرجعي,المرحلة,الدوام,نوع الهيكل,الحالة الإنشائية,الكرفانات,نسبة الأضرار,الطلاب,الصفوف,المساحة الإجمالية,ملاحظات المهندس,خط العرض,خط الطول\n";
            schools.forEach(s => {
                csv += `"${s.name}","${s.code || ''}","${s.type}","${s.shift}","${s.buildingType}","${s.structuralStatus}","${s.caravanCount || 0}","${s.damageRatio || 0}%","${s.students || 0}","${s.classrooms || 0}","${s.totalArea || 0}","${s.notes || ''}","${s.lat}","${s.lng}"\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `تقرير_منظومة_الأبنية_المدرسية_GIS.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // التشغيل الأولي
        loadSchools();
    </script>
</body>
</html>
