<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة إدارة الأبنية المدرسية - Google Satellite</title>
    
    <!-- PWA / iOS Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الأبنية المدرسية">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/167/167707.png">

    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--primary-bg); color: var(--text-light); }

        #map { width: 100%; height: 100vh; z-index: 1; background: #000; }

        /* التحكم العلوي */
        .header-panel {
            position: absolute; top: 15px; right: 15px; left: 15px; z-index: 1000;
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
            padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            color: white; padding: 8px 14px; border-radius: 10px; cursor: pointer;
            font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--accent-blue); color: #000; border: none; }
        .btn-success { background: #10b981; color: #fff; border: none; }

        /* نافذة الإضافة المنسدلة */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 450px; border-radius: 20px;
            padding: 20px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #94a3b8; }
        .form-control {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; font-size: 0.9rem; outline: none;
        }
        .form-control:focus { border-color: var(--accent-blue); }

        /* أدوات الخريطة */
        .map-tools {
            position: absolute; bottom: 30px; right: 15px; z-index: 1000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .tool-btn {
            width: 45px; height: 45px; border-radius: 50%; background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.2); color: white; display: flex;
            align-items: center; justify-content: center; font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header-panel">
        <div class="header-title">
            <i class="fa-solid fa-earth-americas"></i>
            <span>خرائط جوجل القمر الصناعي</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> إضافة مدرسة</button>
            <button class="btn btn-success" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> تصدير</button>
        </div>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- أدوات الخريطة -->
    <div class="map-tools">
        <div class="tool-btn" onclick="locateUser()" title="موقعي الحالي"><i class="fa-solid fa-crosshairs"></i></div>
    </div>

    <!-- نافذة إضافة البيانات -->
    <div class="modal" id="schoolModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة مدرسة جديدة</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
            </div>
            <form id="schoolForm">
                <div class="form-group">
                    <label>اسم المدرسة</label>
                    <input type="text" id="schoolName" class="form-control" required placeholder="مثال: مدرسة الأمل">
                </div>
                <div class="form-group">
                    <label>المرحلة الدراسية</label>
                    <select id="schoolType" class="form-control">
                        <option value="ابتدائية">ابتدائية</option>
                        <option value="متوسطة">متوسطة</option>
                        <option value="إعدادية">إعدادية</option>
                        <option value="ثانوية">ثانوية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>حالة المبنى</label>
                    <select id="buildingStatus" class="form-control">
                        <option value="ممتازة">ممتازة</option>
                        <option value="جيدة">جيدة</option>
                        <option value="تحتاج ترميم">تحتاج ترميم</option>
                        <option value="آيلة للتقويض">آيلة للتقويض</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>عدد الطلاب</label>
                    <input type="number" id="studentCount" class="form-control" placeholder="0">
                </div>
                <div class="form-group">
                    <label>صورة المبنى المدرسي</label>
                    <input type="file" id="schoolImage" accept="image/*" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">حفظ في المنظومة</button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إعداد الخريطة
        const map = L.map('map').setView([33.3152, 44.3661], 13); // مركز الخريطة الافتراضي

        // 🗺️ سيرفر خرائط جوجل القمر الصناعي المباشر (Google Hybrid Satellite)
        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        }).addTo(map);

        let schools = JSON.parse(localStorage.getItem('schools_data')) || [];
        let tempCoords = null;

        // تحميل المدارس المحفوظة
        function loadSchools() {
            schools.forEach(school => addMarker(school));
        }

        // إضافة مؤشر مدرسة
        function addMarker(school) {
            const marker = L.marker([school.lat, school.lng]).addTo(map);
            let popupContent = `
                <div style="direction:rtl; font-size:14px; color:#1e293b;">
                    <b style="font-size:16px; color:#0f172a;">${school.name}</b><br>
                    <b>النوع:</b> ${school.type}<br>
                    <b>حالة المبنى:</b> ${school.status}<br>
                    <b>عدد الطلاب:</b> ${school.students || 'غير محدد'}<br>
            `;
            if (school.image) {
                popupContent += `<img src="${school.image}" style="width:100%; max-height:120px; border-radius:8px; margin-top:5px; object-fit:cover;">`;
            }
            popupContent += `</div>`;
            marker.bindPopup(popupContent);
        }

        // النقر على الخريطة
        map.on('click', function(e) {
            tempCoords = e.latlng;
            openModal();
        });

        function openModal() {
            if (!tempCoords) tempCoords = map.getCenter();
            document.getElementById('schoolModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('schoolModal').style.display = 'none';
            tempCoords = null;
        }

        // حفظ البيانات
        document.getElementById('schoolForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const imageInput = document.getElementById('schoolImage');
            
            const saveSchoolData = (imageData) => {
                const newSchool = {
                    id: Date.now(),
                    name: document.getElementById('schoolName').value,
                    type: document.getElementById('schoolType').value,
                    status: document.getElementById('buildingStatus').value,
                    students: document.getElementById('studentCount').value,
                    lat: tempCoords.lat,
                    lng: tempCoords.lng,
                    image: imageData
                };

                schools.push(newSchool);
                localStorage.setItem('schools_data', JSON.stringify(schools));
                addMarker(newSchool);
                closeModal();
                document.getElementById('schoolForm').reset();
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveSchoolData(e.target.result); };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveSchoolData(null);
            }
        });

        // تحديد الموقع الجغرافي GPS
        function locateUser() {
            map.locate({setView: true, maxZoom: 18});
        }
        map.on('locationfound', function(e) {
            L.circle(e.latlng, e.accuracy).addTo(map);
            L.marker(e.latlng).addTo(map).bindPopup("موقعك الميداني الحالي").openPopup();
        });

        // تصدير البيانات إلى Excel / CSV
        function exportToCSV() {
            if(schools.length === 0) { alert('لا توجد بيانات مدارس لتصديرها!'); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFالاسم,النوع,الحالة,عدد الطلاب,خط العرض,خط الطول\n";
            schools.forEach(s => {
                csvContent += `"${s.name}","${s.type}","${s.status}","${s.students}","${s.lat}","${s.lng}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "مدارس_المنظومة.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // تشغيل المنظومة
        loadSchools();
    </script>
</body>
</html>
